services:
  # EVM local testnet using Anvil
  anvil:
    image: ghcr.io/foundry-rs/foundry:nightly-f625e95
    command: anvil --host 0.0.0.0 --port 8545
    ports:
      - "8545:8545"
    environment:
      RUST_LOG: debug
    networks:
      - perihelion

  # Stellar local testnet using Stellar Quickstart
  stellar:
    image: stellar/quickstart:21.2.0
    command: --local --enable-soroban-rpc
    environment:
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      SOROBAN_RPC_HOST: "0.0.0.0"
      SOROBAN_RPC_PORT: "8000"
    ports:
      - "5432:5432"    # PostgreSQL for Horizon
      - "8000:8000"    # Soroban RPC
      - "8006:8006"    # Horizon HTTP
    networks:
      - perihelion
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Perihelion mempool (local dev mock)
  mempool:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: mempool
    depends_on:
      anvil:
        condition: service_started
      stellar:
        condition: service_started
    environment:
      # Production mode so Express never emits stack traces on error paths.
      NODE_ENV: production
      PORT: 3000
      PERIHELION_SOURCE_CHAIN_ID: 31337
      PERIHELION_ESCROW_ADDRESS: ${PERIHELION_ESCROW_ADDRESS:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}
      # Bind every interface so the relayer and solver containers can reach it.
      PERIHELION_MEMPOOL_HOST: "0.0.0.0"
    ports:
      - "3000:3000"
    networks:
      - perihelion
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 404 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Perihelion relayer
  relayer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: relayer
    depends_on:
      mempool:
        condition: service_started
      anvil:
        condition: service_started
      stellar:
        condition: service_started
    environment:
      NODE_ENV: development
      # EVM configuration
      PERIHELION_EVM_RPC_URL: http://anvil:8545
      PERIHELION_SOURCE_EID: 30101
      # Stellar configuration
      PERIHELION_STELLAR_RPC_URL: http://stellar:8000
      STELLAR_NETWORK: "Test SDF Network ; September 2015"
      PERIHELION_STELLAR_EID: 40161
      # Relayer configuration
      PERIHELION_ESCROW_ADDRESS: ${PERIHELION_ESCROW_ADDRESS:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}
      PERIHELION_SETTLEMENT_CONTRACT: "CA7QYNF7SOWQ3GLR4CIDVXIUCMEOBEEUHW5C33ATIO5Q5TR3LYAQHRJS"
      SIGNER_SECRET: ${SIGNER_SECRET:?set SIGNER_SECRET to a valid Stellar secret key}
      PERIHELION_CONFIRMATIONS: "1"
      PERIHELION_POLL_INTERVAL_MS: "5000"
      PERIHELION_CHECKPOINT_FILE: "/tmp/relayer-checkpoint.json"
      PERIHELION_HEALTH_PORT: "8080"
      # Bind every interface so the published port is reachable from the host.
      PERIHELION_HEALTH_HOST: "0.0.0.0"
      PERIHELION_READINESS_STALE_MS: "15000"
      PERIHELION_MAX_LAG_BLOCKS: "500"
    ports:
      - "8081:8080"
    networks:
      - perihelion
    volumes:
      - relayer-checkpoint:/tmp
    healthcheck:
      test: ["CMD", "node", "/usr/local/lib/perihelion/healthcheck.cjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Perihelion solver
  solver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE: solver
    depends_on:
      mempool:
        condition: service_started
      anvil:
        condition: service_started
      stellar:
        condition: service_started
    environment:
      NODE_ENV: development
      # Mempool configuration
      PERIHELION_MEMPOOL_URL: http://mempool:3000
      # Solver identification
      PERIHELION_SOLVER_ADDRESS: ${PERIHELION_SOLVER_ADDRESS:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}
      # Chain configuration
      PERIHELION_SOURCE_CHAIN_ID: 31337
      PERIHELION_ESCROW_ADDRESS: ${PERIHELION_ESCROW_ADDRESS:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}
      # Solver parameters
      PERIHELION_MIN_MARGIN_BPS: 10
      PERIHELION_POLL_INTERVAL_MS: "2000"
      PERIHELION_SUPPORTED_ASSETS: "native"
      # Executor configuration (EVM)
      PERIHELION_EVM_RPC_URL: http://anvil:8545
      PERIHELION_EVM_PRIVATE_KEY: ${PERIHELION_EVM_PRIVATE_KEY:?set PERIHELION_EVM_PRIVATE_KEY}
      # Executor configuration (Soroban)
      PERIHELION_SOROBAN_RPC_URL: http://stellar:8000
      PERIHELION_SOROBAN_SECRET_KEY: ${PERIHELION_SOROBAN_SECRET_KEY:?set PERIHELION_SOROBAN_SECRET_KEY}
      STELLAR_NETWORK: "Test SDF Network ; September 2015"
      PERIHELION_SETTLEMENT_CONTRACT_ID: "CA7QYNF7SOWQ3GLR4CIDVXIUCMEOBEEUHW5C33ATIO5Q5TR3LYAQHRJS"
      # Cache configuration
      PERIHELION_VERIFICATION_CACHE_SIZE: "10000"
      PERIHELION_SEEN_CACHE_SIZE: "50000"
      # Metrics
      PERIHELION_METRICS_PORT: "9090"
      # Bind every interface so the published port is reachable from the host.
      PERIHELION_METRICS_HOST: "0.0.0.0"
    ports:
      - "9090:9090"
    networks:
      - perihelion
    healthcheck:
      test: ["CMD", "node", "/usr/local/lib/perihelion/healthcheck.cjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  perihelion:
    driver: bridge

volumes:
  relayer-checkpoint:
