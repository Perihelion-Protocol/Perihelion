# cargo-deny configuration for the Soroban contract workspace.
# Run from `contracts/soroban`: `cargo deny check`.

[advisories]
db-url = "https://github.com/rustsec/advisory-db"
db-path = "~/.cargo/advisory-db"
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0387: timing variability in constant-time operations.
    # Pulled in transitively via soroban-sdk 22.0.11 (soroban-env-common /
    # stellar-xdr). The affected code paths are host/test-only and are not
    # compiled into the contract wasm; no secret-dependent constant-time
    # comparison runs on-chain. Revisit when soroban-sdk 23.x is adopted.
    # See https://github.com/issue/1129
    # Review by: 2026-09-30
    "RUSTSEC-2026-0387",
    # RUSTSEC-2024-0388: `derivative` is unmaintained.
    # Transitive via ark-* crates pulled in by soroban-sdk-macros; build-time
    # only, no runtime exposure. Tracked for removal with the next SDK bump.
    # See https://github.com/issue/1129
    # Review by: 2026-09-30
    "RUSTSEC-2024-0388",
    # RUSTSEC-2024-0436: `paste` is unmaintained.
    # Transitive via ark-ff / soroban-sdk-macros; proc-macro/build-time only,
    # not present in the deployed wasm. Tracked for removal with the next SDK
    # bump. See https://github.com/issue/1129
    # Review by: 2026-09-30
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
