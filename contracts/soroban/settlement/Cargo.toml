[package]
name = "perihelion-settlement"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Perihelion Soroban settlement contract — verifies cross-chain intents and releases assets on Stellar"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
# NOTE: constructing an `Address` from raw contract-id bytes (guest/wasm code
# has no other way — see `src/strkey.rs`) needs strkey encoding. The obvious
# choice, the `stellar-strkey` crate, depends on `std` and breaks the wasm
# release build (`E0152: duplicate lang item panic_impl`, conflicting with
# soroban-sdk's own no_std panic handler). `src/strkey.rs` hand-ports just the
# encode path with no dependency, avoiding that conflict.

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
