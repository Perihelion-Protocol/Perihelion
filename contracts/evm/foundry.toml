[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Metadata hashes embed the source path and compiler build, which makes bytecode
# non-deterministic across machines; dropping them lets CI pin exact hashes.
bytecode_hash = "none"
cbor_metadata = false
# Read access to the shared cross-chain wire-format conformance vectors.
fs_permissions = [{ access = "read", path = "../shared" }]
# Gas snapshots: fail CI if gas costs increase beyond tolerance
gas_reports = ["PerihelionEscrow", "PerihelionTimelock"]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = true

# CI profile: selected by FOUNDRY_PROFILE=ci in .github/workflows/differential-fuzz.yml.
# Inherits every [profile.default] setting and only overrides what CI needs.
[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
# Higher optimizer_runs for gas-snapshot fidelity in CI.
optimizer_runs = 10000
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "../shared" }]
gas_reports = ["PerihelionEscrow", "PerihelionTimelock"]

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 1024
depth = 64
fail_on_revert = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
