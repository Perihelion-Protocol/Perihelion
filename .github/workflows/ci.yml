name: CI

# Triggering matrix
# ─────────────────────────────────────────────────────────
# Workflow     | Paths                                         | Purpose
# ─────────────|───────────────────────────────────────────────|────────────────────
# ci.yml       | sdk/, relayer/, solver/, mempool/,            | TypeScript build,
#              | package.json, package-lock.json, .nvmrc,       | test, and lint
#              | tsconfig.base.json, .github/workflows/ci.yml   |
# evm.yml      | contracts/evm/**                               | Solidity build,
#              | .github/workflows/evm.yml                      | test, and Slither
# soroban.yml  | contracts/soroban/**                           | Rust build, test,
#              | .github/workflows/soroban.yml                  | and clippy
# diff-fuzz.yml| (all paths; schedule + dispatch)               | Differential fuzz
#              |                                                | + cross-validation
# pr-lint.yml  | (all PRs)                                      | Conventional-
#              |                                                | commit title check
# ─────────────────────────────────────────────────────────
# docs/ and root .md changes trigger the ci.yml check job so
# branch protection sees a green gate — no heavy test suite runs.

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required gate for branch protection — always passes so the pipeline reports
  # a green check even when path filters skip other jobs.
  check:
    name: Required check
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI triggered — all relevant jobs will run."

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package.json
            relayer/package.json
            solver/package.json
            mempool/package.json

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: make build-ts

      - name: Run tests
        run: make test-ts

  soroban:
    name: Soroban (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/soroban
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/soroban/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/soroban/**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: make lint-soroban
        working-directory: ${{ github.workspace }}

      - name: Unit tests
        run: make test-soroban
        working-directory: ${{ github.workspace }}

      - name: Build wasm (release)
        run: make build-soroban
        working-directory: ${{ github.workspace }}

  evm:
    name: EVM (Solidity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: make build-evm
        working-directory: ${{ github.workspace }}

      - name: Tests
        run: make test-evm
        working-directory: ${{ github.workspace }}

      - name: Gas snapshot
        run: forge snapshot
        working-directory: contracts/evm

      - name: Check gas snapshot
        working-directory: contracts/evm
        run: |
          # Fail if the snapshot changed (regressions detected)
          if ! git diff --exit-code .gas-snapshot; then
            echo "::error::Gas snapshot changed. Run 'forge snapshot' locally and commit the updated .gas-snapshot file."
            echo "If this is an intentional change, verify the new gas values are acceptable."
            exit 1
          fi
