name: CI

# Triggering matrix
# ─────────────────────────────────────────────────────────
# Workflow     | Paths                                         | Purpose
# ─────────────|───────────────────────────────────────────────|────────────────────
# ci.yml       | sdk/, relayer/, solver/, mempool/,            | TypeScript build,
#              | package.json, package-lock.json, .nvmrc,       | test, and lint
#              | tsconfig.base.json, .github/workflows/ci.yml   |
# evm.yml      | contracts/evm/**                               | Solidity build,
#              | .github/workflows/evm.yml                      | test, and Slither
# soroban.yml  | contracts/soroban/**                           | Rust build, test,
#              | .github/workflows/soroban.yml                  | and clippy
# diff-fuzz.yml| (all paths; schedule + dispatch)               | Differential fuzz
#              |                                                | + cross-validation
# pr-lint.yml  | (all PRs)                                      | Conventional-
#              |                                                | commit title check
# ─────────────────────────────────────────────────────────
# docs/ and root .md changes trigger the ci.yml check job so
# branch protection sees a green gate — no heavy test suite runs.

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - "scripts/check-spdx-headers.sh"
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - "scripts/check-spdx-headers.sh"
      - "docs/**"
      - "*.md"

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package.json
            relayer/package.json
            solver/package.json
            mempool/package.json

      - name: Install dependencies
        run: npm ci

      - name: Check SPDX license headers
        run: ./scripts/check-spdx-headers.sh

      - name: Build all packages
        run: make build-ts

      - name: Run tests
        run: make test-ts

  # Required gate for branch protection.
  #
  # This job is the ONLY check registered in GitHub's required-status-checks.
  # It deliberately gates on `typescript` so a build failure is always visible
  # to branch protection, while still passing green when the path filter skips
  # the typescript job entirely (e.g. a docs-only PR that doesn't touch sdk/**).
  #
  # Behaviour matrix:
  #   typescript ran and passed  → check passes  ✅
  #   typescript ran and failed  → check fails   ❌  (build broken, merge blocked)
  #   typescript was skipped     → check passes  ✅  (path filter, docs-only PR)
  check:
    name: Required check
    runs-on: ubuntu-latest
    needs: [typescript]
    if: always()
    steps:
      - name: Assert typescript passed or was skipped
        run: |
          result="${{ needs.typescript.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "::error::typescript job $result — merge is blocked."
            exit 1
          fi
          echo "typescript result: $result — gate passes."
