name: CI

# Triggering matrix
# ─────────────────────────────────────────────────────────
# Workflow     | Paths                                         | Purpose
# ─────────────|───────────────────────────────────────────────|────────────────────
# ci.yml       | sdk/, relayer/, solver/, mempool/,            | TypeScript build,
#              | package.json, package-lock.json, .nvmrc,       | test, and lint
#              | tsconfig.base.json, .github/workflows/ci.yml   |
# evm.yml      | contracts/evm/**                               | Solidity build,
#              | .github/workflows/evm.yml                      | test, and Slither
# soroban.yml  | contracts/soroban/**                           | Rust build, test,
#              | .github/workflows/soroban.yml                  | and clippy
# diff-fuzz.yml| (all paths; schedule + dispatch)               | Differential fuzz
#              |                                                | + cross-validation
# pr-lint.yml  | (all PRs)                                      | Conventional-
#              |                                                | commit title check
# ─────────────────────────────────────────────────────────
# docs/ and root .md changes trigger the ci.yml check job so
# branch protection sees a green gate — no heavy test suite runs.

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required gate for branch protection — always passes so the pipeline reports
  # a green check even when path filters skip other jobs.
  check:
    name: Required check
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI triggered — all relevant jobs will run."

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package.json
            relayer/package.json
            solver/package.json
            mempool/package.json

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm test
