name: CI

# Triggering matrix
# ─────────────────────────────────────────────────────────
# Every workflow below runs on every PR to main; path filtering
# happens INSIDE each workflow (a `changes` job using
# dorny/paths-filter) so the required gate job always reports a
# conclusion. Workflow-level `on.*.paths` filters are avoided
# because a filtered-out PR never creates a run, leaving required
# checks stuck in "Expected — Waiting for status to be reported".
#
# Workflow     | Internal filter (paths)                       | Purpose
# ─────────────|───────────────────────────────────────────────|────────────────────
# ci.yml       | sdk/, relayer/, solver/, mempool/,            | TypeScript build,
#              | package.json, package-lock.json, .nvmrc,       | test, and lint
#              | tsconfig.base.json, .github/workflows/ci.yml,  |
#              | scripts/check-spdx-headers.sh, docs/**, *.md   |
# evm.yml      | contracts/evm/**                               | Solidity build,
#              | .github/workflows/evm.yml                      | test, and Slither
# soroban.yml  | contracts/soroban/**                           | Rust build, test,
#              | .github/workflows/soroban.yml                  | and clippy
# coverage.yml | sdk/, relayer/, solver/, mempool/,             | Per-stack coverage
#              | contracts/soroban/**, contracts/evm/**,        | (ts/soroban/evm),
#              | package.json, package-lock.json, .nvmrc,       | scoped per job via
#              | tsconfig.base.json,                            | dorny/paths-filter
#              | .github/workflows/coverage.yml                 |
# diff-fuzz.yml| contracts/soroban/**, contracts/evm/**,       | Differential fuzz
#              | contracts/shared/wire-vectors/**; schedule    | + cross-validation
#              | + dispatch run unfiltered                      |
# pr-lint.yml  | (all PRs)                                      | Conventional-
#              |                                                | commit title check
# ─────────────────────────────────────────────────────────
# docs/ and root .md changes trigger the ci.yml check job so
# branch protection sees a green gate — no heavy test suite runs.
# The `changes` job (dorny/paths-filter) decides whether the heavy
# `typescript` and `e2e` jobs run; `check` always reports.

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "test/**"
      - "docker/**"
      - "scripts/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "test/**"
      - "docker/**"
      - "scripts/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - "docs/**"
      - "*.md"

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs only check out, build, and test.
permissions:
  contents: read

jobs:
  # Detect whether the heavy jobs need to run. Docs-only and root .md
  # changes leave `typescript` false, so the build/test matrix is skipped
  # while the `check` gate still reports green.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            typescript:
              - "sdk/**"
              - "relayer/**"
              - "solver/**"
              - "mempool/**"
              - "test/**"
              - "docker/**"
              - "scripts/**"
              - "Makefile"
              - "package.json"
              - "package-lock.json"
              - ".nvmrc"
              - "tsconfig.base.json"
              - ".github/workflows/ci.yml"

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package.json
            relayer/package.json
            solver/package.json
            mempool/package.json

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency tree is complete
        run: |
          # Fail fast if the lockfile has dangling dependency edges (e.g. a
          # package listed as a dependency of another but with no entry of its
          # own). `npm ci`'s sync check does not catch this.
          npm ls --all > /dev/null
          missing="$(npm query ':missing')"
          if [ "$missing" != "[]" ]; then
            echo "::error::Lockfile has missing packages:"
            echo "$missing"
            exit 1
          fi

      - name: Check SPDX license headers
        run: ./scripts/check-spdx-headers.sh

      - name: Build all packages
        run: make build-ts

      - name: Lint and typecheck
        run: make lint-ts

      - name: Run tests
        run: make test-ts

  e2e:
    name: End-to-end tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency tree is complete
        run: |
          # Fail fast if the lockfile has dangling dependency edges (e.g. a
          # package listed as a dependency of another but with no entry of its
          # own). `npm ci`'s sync check does not catch this.
          npm ls --all > /dev/null
          missing="$(npm query ':missing')"
          if [ "$missing" != "[]" ]; then
            echo "::error::Lockfile has missing packages:"
            echo "$missing"
            exit 1
          fi

      - name: Build all packages
        run: make build-ts

      - name: Run end-to-end tests
        run: make test-e2e

  # Required gate for branch protection: `CI / required`.
  #
  # This job is the ONLY check from this workflow registered in GitHub's
  # required-status-checks. It gates on `typescript` and `e2e` so a build
  # failure is always visible to branch protection, while still passing green
  # when the internal `changes` filter skips those jobs (e.g. a docs-only PR).
  #
  # Behaviour matrix (job-level skipping, not workflow-level):
  #   typescript ran and passed  → gate passes  ✅
  #   typescript ran and failed  → gate fails   ❌  (build broken, merge blocked)
  #   typescript was skipped     → gate passes  ✅  (path filter, docs-only PR)
  #   e2e ran and passed         → gate passes  ✅
  #   e2e ran and failed         → gate fails   ❌  (e2e broken, merge blocked)
  #   e2e was skipped            → gate passes  ✅  (path filter, docs-only PR)
  required:
    name: CI / required
    runs-on: ubuntu-latest
    needs: [changes, typescript, e2e]
    if: always()
    steps:
      - name: Assert typescript, e2e, and lock-sync passed or were skipped
        run: |
          for result in "${{ needs.changes.result }}" "${{ needs.typescript.result }}" "${{ needs.e2e.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A job $result — merge is blocked."
              exit 1
            fi
          done
          echo "All jobs passed or were skipped — gate passes."
