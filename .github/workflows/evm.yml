name: EVM

on:
  push:
    branches: [main]
    paths: ["contracts/evm/**", ".github/workflows/evm.yml"]
  pull_request:
    branches: [main]
    paths: ["contracts/evm/**", ".github/workflows/evm.yml"]

concurrency:
  group: evm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evm:
    name: EVM (Solidity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-f3f12cf3ccfae5c4db8ac622c165198125a83266

      - name: Cache Foundry build
        uses: actions/cache@v4
        with:
          path: contracts/evm/out
          key: ${{ runner.os }}-forge-out-${{ hashFiles('contracts/evm/src/**/*.sol', 'contracts/evm/test/**/*.sol', 'contracts/evm/foundry.toml') }}

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Tests
        run: forge test -vvv

  slither:
    name: Slither (static analysis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-f3f12cf3ccfae5c4db8ac622c165198125a83266

      - name: Cache Foundry build
        uses: actions/cache@v4
        with:
          path: contracts/evm/out
          key: ${{ runner.os }}-forge-out-${{ hashFiles('contracts/evm/src/**/*.sol', 'contracts/evm/test/**/*.sol', 'contracts/evm/foundry.toml') }}

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Analyze
        run: slither src/ --config-file slither.config.json
