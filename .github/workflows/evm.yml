name: EVM

# Path filtering happens inside the workflow (see the `changes` job) rather
# than via `on.*.paths`. Workflow-level filters prevent the run from being
# created at all, which leaves required checks stuck on "Expected — Waiting
# for status to be reported" for PRs that don't touch these paths.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Single source of truth for the Foundry version; see CONTRIBUTING.md.
  # Pinned to an exact release so builds are reproducible; keep in step with
  # the other workflows and scripts/check-toolchain.sh.
  FOUNDRY_VERSION: v1.3.5

concurrency:
  group: evm-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs override this where a broader scope is needed.
permissions:
  contents: read

jobs:
  changes:
    name: Detect EVM changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      evm: ${{ steps.filter.outputs.evm }}
      sdk_escrow: ${{ steps.filter.outputs.sdk_escrow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            evm:
              - 'contracts/evm/**'
              - '.github/workflows/evm.yml'
            sdk_escrow:
              - 'contracts/evm/**'
              - '.github/workflows/evm.yml'
              - 'sdk/src/escrow-abi.ts'
              - 'sdk/src/escrow-client.ts'
              - 'sdk/test/escrow-client.test.ts'
              - 'scripts/gen-escrow-abi.mjs'

  evm:
    name: EVM (Solidity)
    needs: changes
    if: needs.changes.outputs.evm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf  # v1.6.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Cache Foundry build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v4.2.3
        with:
          path: contracts/evm/out
          key: ${{ runner.os }}-forge-out-${{ hashFiles('contracts/evm/src/**/*.sol', 'contracts/evm/test/**/*.sol', 'contracts/evm/foundry.toml') }}

      - name: Format check
        run: forge fmt --check

      - name: Build
        working-directory: .
        run: make build-evm

      - name: Tests
        working-directory: .
        run: make test-evm

      - name: Gas snapshot check
        run: forge snapshot --check --tolerance 1

      # The gas diff is what reviewers actually read; the pass/fail above only
      # says "something moved", not by how much or where.
      - name: Generate gas report
        if: github.event_name == 'pull_request'
        run: forge test --gas-report --json > gas-report.json

      - name: Compare gas reports
        if: github.event_name == 'pull_request'
        id: gas_diff
        uses: Rubilmax/foundry-gas-diff@60e763d02526ee3299bd04278cb178d1547b134b  # v3.21.0
        with:
          report: contracts/evm/gas-report.json
          ignore: test/**/*

      - name: Comment gas diff on PR
        if: github.event_name == 'pull_request' && steps.gas_diff.outputs.markdown != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: evm-gas-diff
          message: ${{ steps.gas_diff.outputs.markdown }}

  slither:
    name: Slither (static analysis)
    needs: changes
    if: needs.changes.outputs.evm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf  # v1.6.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Cache Foundry build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v4.2.3
        with:
          path: contracts/evm/out
          key: ${{ runner.os }}-forge-out-${{ hashFiles('contracts/evm/src/**/*.sol', 'contracts/evm/test/**/*.sol', 'contracts/evm/foundry.toml') }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pip install "slither-analyzer==0.11.6"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Audit triage database justifications
        working-directory: .
        run: node scripts/check-slither-triage.mjs contracts/evm/slither.db.json

      - name: Analyze
        run: |
          slither src/ \
            --config-file slither.config.json \
            --triage-database slither.db.json \
            --fail-high \
            --sarif slither.sarif \
            --json slither-report.json

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470  # v3
        with:
          sarif_file: contracts/evm/slither.sarif

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: slither-report
          path: |
            contracts/evm/slither-report.json
            contracts/evm/slither.sarif
          if-no-files-found: ignore

  bytecode:
    name: Reproducible bytecode
    needs: changes
    if: needs.changes.outputs.evm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf  # v1.6.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Compare build against pinned bytecode
        run: ./scripts/check-pinned-bytecode.sh

  # The SDK's ESCROW_ABI is generated from the contract build; fail if the
  # committed copy is stale, then exercise PerihelionEscrowClient against a
  # deployed escrow on Anvil (getLock, and refundStatus against cancelExpired).
  sdk-abi:
    name: SDK ABI in sync
    needs: changes
    if: needs.changes.outputs.sdk_escrow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf  # v1.6.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check escrow-abi.ts matches the contract build
        run: make sdk-abi-check

      - name: Escrow client tests (Anvil)
        working-directory: sdk
        run: node --test --import tsx test/escrow-client.test.ts

  natspec:
    name: NatSpec coverage
    needs: changes
    if: needs.changes.outputs.evm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf  # v1.6.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Verify toolchain in effect
        run: ../../scripts/check-toolchain.sh foundry

      - name: Generate NatSpec docs
        run: forge doc --out /tmp/natspec-out 2>&1 | tee /tmp/natspec-warnings.txt

      - name: Upload NatSpec docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: natspec-docs
          path: /tmp/natspec-out/
          if-no-files-found: ignore

      - name: Check for missing NatSpec
        run: |
          # Fail if forge build emits warnings about missing @param or @return
          # on public/external functions. The --force flag ensures a fresh build.
          forge build --force 2>&1 | tee /tmp/build-out.txt
          if grep -qE 'Warning.*@(param|return|notice)' /tmp/build-out.txt; then
            echo "::error::NatSpec gaps detected in public/external functions:"
            grep -E 'Warning.*@(param|return|notice)' /tmp/build-out.txt
            exit 1
          fi
          echo "NatSpec check passed."

  # Required gate for branch protection on the EVM workflow.
  # This job always runs (the workflow is triggered on every PR to main), so
  # it always reports a conclusion. Jobs skipped by the `changes` filter
  # report `skipped`, which passes the gate; only `failure` or `cancelled`
  # block the merge.
  check:
    name: EVM / required
    runs-on: ubuntu-latest
    needs: [evm, slither, bytecode, sdk-abi, natspec]
    if: always()
    steps:
      - name: Assert all EVM jobs passed or were skipped
        run: |
          for result in "${{ needs.evm.result }}" "${{ needs.slither.result }}" "${{ needs.bytecode.result }}" "${{ needs.sdk-abi.result }}" "${{ needs.natspec.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::An EVM job $result — merge is blocked."
              exit 1
            fi
          done
          echo "All EVM jobs passed or were skipped — gate passes."
