name: EVM

on:
  push:
    branches: [main]
    paths: ["contracts/evm/**", ".github/workflows/evm.yml"]
  pull_request:
    branches: [main]
    paths: ["contracts/evm/**", ".github/workflows/evm.yml"]

concurrency:
  group: evm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evm:
    name: EVM (Solidity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-f3f12cf3ccfae5c4db8ac622c165198125a83266

      - name: Cache Foundry build
        uses: actions/cache@v4
        with:
          path: contracts/evm/out
          key: ${{ runner.os }}-forge-out-${{ hashFiles('contracts/evm/src/**/*.sol', 'contracts/evm/test/**/*.sol', 'contracts/evm/foundry.toml') }}

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Tests
        run: forge test -vvv

  slither:
    name: Slither (static analysis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-f3f12cf3ccfae5c4db8ac622c165198125a83266

      - name: Cache Foundry build
        uses: actions/cache@v4
        with:
          path: contracts/evm/out
          key: ${{ runner.os }}-forge-out-${{ hashFiles('contracts/evm/src/**/*.sol', 'contracts/evm/test/**/*.sol', 'contracts/evm/foundry.toml') }}

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Analyze
        run: slither src/ --config-file slither.config.json --json slither-report.json

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: contracts/evm/slither-report.json
          if-no-files-found: ignore

  natspec:
    name: NatSpec coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Generate NatSpec docs
        run: forge doc --out /tmp/natspec-out 2>&1 | tee /tmp/natspec-warnings.txt

      - name: Upload NatSpec docs
        uses: actions/upload-artifact@v4
        with:
          name: natspec-docs
          path: /tmp/natspec-out/
          if-no-files-found: ignore

      - name: Check for missing NatSpec
        run: |
          # Fail if forge build emits warnings about missing @param or @return
          # on public/external functions. The --force flag ensures a fresh build.
          forge build --force 2>&1 | tee /tmp/build-out.txt
          if grep -qE 'Warning.*@(param|return|notice)' /tmp/build-out.txt; then
            echo "::error::NatSpec gaps detected in public/external functions:"
            grep -E 'Warning.*@(param|return|notice)' /tmp/build-out.txt
            exit 1
          fi
          echo "NatSpec check passed."
