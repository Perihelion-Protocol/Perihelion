name: Coverage

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "solver/**"
      - "relayer/**"
      - "mempool/**"
      - "contracts/soroban/**"
      - "contracts/evm/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - "solver/**"
      - "relayer/**"
      - "mempool/**"
      - "contracts/soroban/**"
      - "contracts/evm/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .github/workflows/evm.yml and CONTRIBUTING.md.
  FOUNDRY_VERSION: v1.3.5

# Least-privilege default; jobs only check out, build, and upload coverage.
permissions:
  contents: read

jobs:
  # Determine which stacks changed so each coverage job runs only for its own
  # stack (e.g. an sdk/ change does not trigger Soroban or EVM coverage).
  changes:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      soroban: ${{ steps.filter.outputs.soroban }}
      evm: ${{ steps.filter.outputs.evm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            ts:
              - 'sdk/**'
              - 'solver/**'
              - 'relayer/**'
              - 'mempool/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'tsconfig.base.json'
            soroban:
              - 'contracts/soroban/**'
            evm:
              - 'contracts/evm/**'

  # Enforce that every `uses:` reference is pinned to a full 40-character
  # commit SHA (no floating major tags). Runs whenever a workflow changes.
  workflow-lint:
    name: Workflow SHA pinning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Check all actions are pinned to a commit SHA
        run: |
          set -euo pipefail
          # Match `uses: owner/repo@vN` (floating major tag) and any other
          # non-SHA ref. Local actions (`./path`) and docker refs are skipped.
          if grep -rnE 'uses: [^@]+@v[0-9]' .github/workflows; then
            echo "::error::Found actions pinned to a floating tag; pin to a full commit SHA."
            exit 1
          fi
          if grep -rnE 'uses: [^./][^@]*@' .github/workflows \
              | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' ; then
            echo "::error::Found actions not pinned to a 40-character commit SHA."
            exit 1
          fi
          echo "All actions are pinned to commit SHAs."

  # ── TypeScript (sdk / solver / relayer / mempool) ───────────────────────────
  ts-coverage:
    name: TypeScript Coverage (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sdk, solver, relayer, mempool]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run coverage
        run: npm run test:coverage --workspace=${{ matrix.package }}

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./${{ matrix.package }}/coverage/lcov.info
          flags: ts-${{ matrix.package }}
          name: ts-${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # Do not fail the build if the upload fails — coverage is a signal,
          # not a gate on the upload service being available.
          fail_ci_if_error: false

  # ── Soroban (Rust) ───────────────────────────────────────────────────────────
  soroban-coverage:
    name: Soroban Coverage
    needs: changes
    if: needs.changes.outputs.soroban == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/soroban
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      # The toolchain version comes from rust-toolchain.toml, so coverage is
      # measured with the same compiler that gates the tests.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master (pinned)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          # llvm-tools-preview is required by cargo-llvm-cov
          components: llvm-tools-preview

      - name: Verify toolchain in effect
        run: ../../scripts/check-toolchain.sh rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/soroban/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/soroban/**/Cargo.toml', 'contracts/soroban/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate lcov coverage
        # Exclude the fuzz module and test helpers from the coverage report.
        run: >
          cargo llvm-cov
          --lcov
          --output-path lcov.info
          --ignore-filename-regex '(fuzz|test)\.rs$'

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: contracts/soroban/lcov.info
          flags: soroban
          name: soroban
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── EVM (Solidity / Foundry) ─────────────────────────────────────────────────
  evm-coverage:
    name: EVM Coverage
    needs: changes
    if: needs.changes.outputs.evm == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      # forge-std is vendored as a submodule; check it out at the pinned commit
      # rather than installing it at a floating ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09  # v1.6.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Verify toolchain in effect
        run: ../../scripts/check-toolchain.sh foundry

      - name: Generate lcov coverage
        # --report lcov writes lcov.info into the working directory.
        # --lcov-version 1 uses the legacy single-file format that Codecov
        # accepts without further conversion.
        run: forge coverage --report lcov --lcov-version 1

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: contracts/evm/lcov.info
          flags: evm
          name: evm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Aggregate summary ────────────────────────────────────────────────────────
  # PR comments are produced by Codecov's server once all per-flag uploads
  # arrive (see `.codecov.yml`); this job only reports the outcome of the
  # per-stack coverage jobs and fails when any of them failed.
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [ts-coverage, soroban-coverage, evm-coverage]
    # Run even if individual coverage jobs fail so the summary is always posted.
    if: always()
    steps:
      - name: Summarise coverage job results
        env:
          TS_RESULT: ${{ needs.ts-coverage.result }}
          SOROBAN_RESULT: ${{ needs.soroban-coverage.result }}
          EVM_RESULT: ${{ needs.evm-coverage.result }}
        run: |
          set -euo pipefail
          {
            echo "## Coverage summary"
            echo ""
            echo "| Stack | Result |"
            echo "| --- | --- |"
            echo "| TypeScript (sdk/solver/relayer/mempool) | ${TS_RESULT} |"
            echo "| Soroban | ${SOROBAN_RESULT} |"
            echo "| EVM | ${EVM_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in "$TS_RESULT" "$SOROBAN_RESULT" "$EVM_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more coverage jobs failed."
            exit 1
          fi
