name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .github/workflows/evm.yml and CONTRIBUTING.md.
  FOUNDRY_VERSION: stable

jobs:
  # ── TypeScript (sdk / solver / relayer / mempool) ───────────────────────────
  ts-coverage:
    name: TypeScript Coverage (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sdk, solver, relayer, mempool]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run coverage
        run: npm run test:coverage --workspace=${{ matrix.package }}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./${{ matrix.package }}/coverage/lcov.info
          flags: ts-${{ matrix.package }}
          name: ts-${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # Do not fail the build if the upload fails — coverage is a signal,
          # not a gate on the upload service being available.
          fail_ci_if_error: false

  # ── Soroban (Rust) ───────────────────────────────────────────────────────────
  soroban-coverage:
    name: Soroban Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/soroban
    steps:
      - uses: actions/checkout@v4

      # The toolchain version comes from rust-toolchain.toml, so coverage is
      # measured with the same compiler that gates the tests.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          # llvm-tools-preview is required by cargo-llvm-cov
          components: llvm-tools-preview

      - name: Verify toolchain in effect
        run: ../../scripts/check-toolchain.sh rust

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/soroban/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/soroban/**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate lcov coverage
        # Exclude the fuzz module and test helpers from the coverage report.
        run: >
          cargo llvm-cov
          --lcov
          --output-path lcov.info
          --ignore-filename-regex '(fuzz|test)\.rs$'

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: contracts/soroban/lcov.info
          flags: soroban
          name: soroban
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── EVM (Solidity / Foundry) ─────────────────────────────────────────────────
  evm-coverage:
    name: EVM Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Verify toolchain in effect
        run: ../../scripts/check-toolchain.sh foundry

      - name: Install forge-std
        run: forge install foundry-rs/forge-std@${{ env.FORGE_STD_VERSION }} --no-git

      - name: Generate lcov coverage
        # --report lcov writes lcov.info into the working directory.
        # --lcov-version 1 uses the legacy single-file format that Codecov
        # accepts without further conversion.
        run: forge coverage --report lcov --lcov-version 1

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: contracts/evm/lcov.info
          flags: evm
          name: evm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Aggregate summary ────────────────────────────────────────────────────────
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [ts-coverage, soroban-coverage, evm-coverage]
    # Run even if individual coverage jobs fail (partial upload is still useful).
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Post Codecov PR comment
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
