name: Coverage

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "solver/**"
      - "relayer/**"
      - "mempool/**"
      - "contracts/soroban/**"
      - "contracts/evm/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - "solver/**"
      - "relayer/**"
      - "mempool/**"
      - "contracts/soroban/**"
      - "contracts/evm/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "tsconfig.base.json"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .github/workflows/evm.yml and CONTRIBUTING.md.
  FOUNDRY_VERSION: stable

# Least-privilege default; jobs only check out, build, and upload coverage.
permissions:
  contents: read

jobs:
  # Determine which stacks changed so each coverage job runs only for its own
  # stack (e.g. an sdk/ change does not trigger Soroban or EVM coverage).
  changes:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      soroban: ${{ steps.filter.outputs.soroban }}
      evm: ${{ steps.filter.outputs.evm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'sdk/**'
              - 'solver/**'
              - 'relayer/**'
              - 'mempool/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - 'tsconfig.base.json'
            soroban:
              - 'contracts/soroban/**'
            evm:
              - 'contracts/evm/**'

  # ── TypeScript (sdk / solver / relayer / mempool) ───────────────────────────
  ts-coverage:
    name: TypeScript Coverage (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sdk, solver, relayer, mempool]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run coverage
        run: npm run test:coverage --workspace=${{ matrix.package }}

      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
        with:
          files: ./${{ matrix.package }}/coverage/lcov.info
          flags: ts-${{ matrix.package }}
          name: ts-${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # Do not fail the build if the upload fails — coverage is a signal,
          # not a gate on the upload service being available.
          fail_ci_if_error: false

  # ── Soroban (Rust) ───────────────────────────────────────────────────────────
  soroban-coverage:
    name: Soroban Coverage
    needs: changes
    if: needs.changes.outputs.soroban == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/soroban
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      # The toolchain version comes from rust-toolchain.toml, so coverage is
      # measured with the same compiler that gates the tests.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master (pinned)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          # llvm-tools-preview is required by cargo-llvm-cov
          components: llvm-tools-preview

      - name: Verify toolchain in effect
        run: ../../scripts/check-toolchain.sh rust

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/soroban/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/soroban/**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29  # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate lcov coverage
        # Exclude the fuzz module and test helpers from the coverage report.
        run: >
          cargo llvm-cov
          --lcov
          --output-path lcov.info
          --ignore-filename-regex '(fuzz|test)\.rs$'

      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
        with:
          files: contracts/soroban/lcov.info
          flags: soroban
          name: soroban
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── EVM (Solidity / Foundry) ─────────────────────────────────────────────────
  evm-coverage:
    name: EVM Coverage
    needs: changes
    if: needs.changes.outputs.evm == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09  # v1.6.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Verify toolchain in effect
        run: ../../scripts/check-toolchain.sh foundry

      - name: Install forge-std
        run: forge install foundry-rs/forge-std@${{ env.FORGE_STD_VERSION }} --no-git

      - name: Generate lcov coverage
        # --report lcov writes lcov.info into the working directory.
        # --lcov-version 1 uses the legacy single-file format that Codecov
        # accepts without further conversion.
        run: forge coverage --report lcov --lcov-version 1

      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
        with:
          files: contracts/evm/lcov.info
          flags: evm
          name: evm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Aggregate summary ────────────────────────────────────────────────────────
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [ts-coverage, soroban-coverage, evm-coverage]
    # Run even if individual coverage jobs fail (partial upload is still useful).
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Post Codecov PR comment
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
