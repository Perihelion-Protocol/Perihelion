name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-lint-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: this job only reads PR metadata to lint the title.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825  # v5.5.3
        id: lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
          # Keep in step with the repository layout. deps / deps-dev are the
          # scopes Dependabot uses (see commit-message in .github/dependabot.yml);
          # without them every automated dependency PR fails this check.
          scopes: |
            evm
            soroban
            sdk
            relayer
            solver
            mempool
            test
            shared
            scripts
            docs
            ci
            docker
            deps
            deps-dev
          requireScope: false
          subjectLength: 100
          wip: true
          validateSingleCommit: false

      - name: Lint result
        if: always() && steps.lint.outputs.error_message != null
        run: |
          echo "::error::${{ steps.lint.outputs.error_message }}"
          exit 1
