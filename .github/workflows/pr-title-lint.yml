name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        id: lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
          scopes: |
            evm
            soroban
            sdk
            relayer
            solver
            mempool
            docs
            ci
          requireScope: false
          subjectLength: 100
          wip: true
          validateSingleCommit: false

      - name: Lint result
        if: always() && steps.lint.outputs.error_message != null
        run: |
          echo "::error::${{ steps.lint.outputs.error_message }}"
          exit 1
