name: Docs

on:
  schedule:
    # Nightly external link check at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - '.spectral.yaml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/docs.yml'
      - 'scripts/check-status-links.mjs'
      - '.github/fixtures/**'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - '.spectral.yaml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/docs.yml'
      - 'scripts/check-status-links.mjs'
      - '.github/fixtures/**'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-lint:
    name: Lint mempool OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Lint docs/api/mempool-api.yaml with Spectral
        run: npx --yes @stoplight/spectral-cli lint docs/api/mempool-api.yaml

  validate-templates:
    name: Validate issue/PR templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate YAML templates
        run: |
          python3 - <<'EOF'
          import sys
          import yaml
          from pathlib import Path

          errors = []
          template_dir = Path(".github/ISSUE_TEMPLATE")

          for path in sorted(template_dir.glob("*.yml")):
              try:
                  with open(path) as f:
                      doc = yaml.safe_load(f)
              except yaml.YAMLError as e:
                  errors.append(f"{path}: YAML parse error: {e}")
                  continue

              if not isinstance(doc, dict):
                  errors.append(f"{path}: expected a YAML mapping at the top level")
                  continue

              for required in ("name", "description"):
                  if required not in doc:
                      errors.append(f"{path}: missing required field '{required}'")

              if "body" in doc:
                  if not isinstance(doc["body"], list):
                      errors.append(f"{path}: 'body' must be a list")
                  else:
                      for i, item in enumerate(doc["body"]):
                          if not isinstance(item, dict) or "type" not in item:
                              errors.append(f"{path}: body[{i}] missing 'type' field")

          if errors:
              for err in errors:
                  print(f"::error::{err}")
              sys.exit(1)
          else:
              print(f"All {len(list(template_dir.glob('*.yml')))} YAML templates are valid.")
          EOF

  status-table-links:
    name: Implementation Status links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Needs the API to resolve issue state, so it runs with the default token.
      - name: Check the table links no closed issues
        run: node scripts/check-status-links.mjs README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A gate nobody has watched fail is an assumption. The fixture links a
      # closed issue, so a passing run here means the check still gates.
      - name: Verify the check fails on a closed link
        run: |
          if node scripts/check-status-links.mjs .github/fixtures/status-table-closed-issue.md; then
            echo "::error::check-status-links.mjs passed a table linking a closed issue"
            exit 1
          fi
          echo "check-status-links.mjs correctly rejected the fixture"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3

      - name: Check relative links
        run: |
          set -e
          FILES=$(find . -name '*.md' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path '*/target/*' \
            -not -path '*/contracts/*')
          FAILED=0
          for f in $FILES; do
            markdown-link-check "$f" --config .mlc-config.json || FAILED=1
          done
          exit $FAILED

  markdown-links-external:
    name: Check external links (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3

      - name: Check all links including external
        run: |
          set -e
          FILES=$(find . -name '*.md' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path '*/target/*' \
            -not -path '*/contracts/*')
          FAILED=0
          for f in $FILES; do
            markdown-link-check "$f" --config .mlc-config.json || FAILED=1
          done
          exit $FAILED
