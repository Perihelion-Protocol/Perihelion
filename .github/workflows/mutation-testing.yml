name: Mutation Testing

# Runs on a periodic schedule (not on every push — mutation testing is expensive).
# Also triggerable manually to inspect score at any point.
#
# Jobs:
#   mutants-soroban   — cargo-mutants on the Soroban settlement contract (Rust)
#   mutants-ts        — Stryker on the TypeScript packages (sdk, relayer, solver)
#   mutants-evm       — vertigo-rs / forge-based mutation testing for EVM contracts
#
# Each job records the tool's exit status instead of suppressing it, uploads
# its report unconditionally, and only then fails in a final "Enforce" step.
# That keeps the artefact on a bad night without turning the job into a
# report nobody is accountable for (#768). Thresholds are committed config:
#   Stryker        thresholds.break in stryker.config.mjs
#   cargo-mutants  BASELINE_MIN_SCORE in scripts/check-cargo-mutants-score.mjs

on:
  schedule:
    # Nightly at 03:00 UTC (off-peak, avoids collision with the differential-fuzz job at 02:00)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      stack:
        description: 'Which stack to mutate (soroban | ts | evm | all)'
        required: false
        default: 'all'
        type: choice
        options: [soroban, ts, evm, all]

env:
  # Keep in step with .github/workflows/evm.yml and CONTRIBUTING.md.
  FOUNDRY_VERSION: v1.3.5

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs only check out, build, and run mutation tools.
permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Soroban / Rust: cargo-mutants
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  mutants-soroban:
    name: cargo-mutants (Soroban)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (inputs.stack == 'soroban' || inputs.stack == 'all')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable (pinned)
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/soroban/target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('contracts/soroban/**/Cargo.toml') }}

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version "24.7.1"

      # Same command as `make mutation-soroban`. `--output .` places the
      # report at ./mutants.out (cargo-mutants creates mutants.out *inside*
      # the --output directory). Exit codes: 0 all caught, 2 missed mutants,
      # 3 timeouts — those are scored by the gate below; anything else
      # (baseline test failure, usage error) fails the job outright.
      - name: Run cargo-mutants on settlement contract
        id: mutants
        working-directory: contracts/soroban/settlement
        run: |
          set +e
          cargo mutants --timeout 120 --jobs 2 --output . 2>&1 | tee mutation-report.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarise results
        if: always()
        working-directory: contracts/soroban/settlement
        run: |
          echo "## Soroban Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 mutation-report.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload cargo-mutants report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: soroban-mutants-report
          path: |
            contracts/soroban/settlement/mutants.out/
            contracts/soroban/settlement/mutation-report.txt

      - name: Enforce mutation score baseline
        if: always()
        env:
          MUTANTS_EXIT: ${{ steps.mutants.outputs.exit }}
        run: |
          case "$MUTANTS_EXIT" in
            0|2|3) node scripts/check-cargo-mutants-score.mjs contracts/soroban/settlement/mutants.out ;;
            *) echo "::error::cargo-mutants did not complete (exit '${MUTANTS_EXIT:-none}')"; exit 1 ;;
          esac

# ─────────────────────────────────────────────────────────────────────────────
# TypeScript: Stryker
# ─────────────────────────────────────────────────────────────────────────────
  mutants-ts:
    name: Stryker (TypeScript)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (inputs.stack == 'ts' || inputs.stack == 'all')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript packages
        run: npm run build

      # Stryker is a root devDependency resolved from package-lock.json, and
      # all settings (mutate scope, runner, thresholds, reporters) come from
      # the committed stryker*.config.mjs files — the same ones
      # `make mutation-ts` uses. No CLI overrides here, so local and CI runs
      # cannot drift.
      - name: Run Stryker on SDK (highest priority)
        id: stryker-sdk
        run: |
          set +e
          npx stryker run stryker.sdk.config.mjs 2>&1 | tee sdk-mutation-report.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Run Stryker on relayer + solver
        id: stryker-services
        if: always()
        run: |
          set +e
          npx stryker run stryker.services.config.mjs 2>&1 | tee solver-mutation-report.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarise Stryker results
        if: always()
        run: |
          echo "## TypeScript Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in sdk-mutation-report.txt solver-mutation-report.txt; do
            if [ -f "$f" ]; then
              echo "### $f" >> $GITHUB_STEP_SUMMARY
              grep -E "(Mutation score|mutants|Killed|Survived|Timeout)" "$f" | tail -10 >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload Stryker reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: stryker-mutation-report
          path: |
            sdk-mutation-report.txt
            solver-mutation-report.txt
            reports/mutation/

      # Stryker exits non-zero when the score is below thresholds.break
      # (or the run itself errors); re-raise that now the reports are safe.
      - name: Enforce mutation score baseline
        if: always()
        env:
          SDK_EXIT: ${{ steps.stryker-sdk.outputs.exit }}
          SERVICES_EXIT: ${{ steps.stryker-services.outputs.exit }}
        run: |
          status=0
          if [ "$SDK_EXIT" != "0" ]; then
            echo "::error::Stryker (sdk) failed or scored below thresholds.break (exit '${SDK_EXIT:-none}')"
            status=1
          fi
          if [ "$SERVICES_EXIT" != "0" ]; then
            echo "::error::Stryker (relayer + solver) failed or scored below thresholds.break (exit '${SERVICES_EXIT:-none}')"
            status=1
          fi
          exit $status

# ─────────────────────────────────────────────────────────────────────────────
# EVM / Solidity: vertigo-rs (forge-based mutation testing)
# ─────────────────────────────────────────────────────────────────────────────
  mutants-evm:
    name: vertigo-rs (EVM)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (inputs.stack == 'evm' || inputs.stack == 'all')
    steps:
      # forge-std is vendored as a git submodule; checking it out recursively
      # pins it by submodule commit (single source of truth, no forge install).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09  # v1.6.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install Rust (required by vertigo-rs)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable (pinned)

      - name: Install vertigo-rs
        # TODO(maintainer): pin to a specific crates.io version once verified;
        # crates.io could not be reached from this environment to confirm one.
        run: cargo install vertigo-rs --locked

      - name: Build EVM contracts
        working-directory: contracts/evm
        run: forge build

      - name: Run vertigo-rs mutation testing
        id: vertigo
        working-directory: contracts/evm
        run: |
          set +e
          vertigo run \
            --match-contract PerihelionEscrow \
            2>&1 | tee mutation-report.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarise EVM results
        if: always()
        run: |
          echo "## EVM Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f contracts/evm/mutation-report.txt ]; then
            tail -30 contracts/evm/mutation-report.txt >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload EVM mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: evm-mutation-report
          path: contracts/evm/mutation-report.txt

      - name: Enforce vertigo-rs result
        if: always()
        env:
          VERTIGO_EXIT: ${{ steps.vertigo.outputs.exit }}
        run: |
          if [ "$VERTIGO_EXIT" != "0" ]; then
            echo "::error::vertigo-rs failed (exit '${VERTIGO_EXIT:-none}')"
            exit 1
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Summary
# ─────────────────────────────────────────────────────────────────────────────
  mutation-summary:
    name: Mutation Score Summary
    needs: [mutants-soroban, mutants-ts, mutants-evm]
    if: always()
    runs-on: ubuntu-latest
    # Write access is granted to this job only, for the tracking-issue step.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Final summary
        run: |
          echo "## Mutation Testing Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stack   | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Soroban | ${{ needs.mutants-soroban.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ needs.mutants-ts.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EVM | ${{ needs.mutants-evm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artefacts for the full report (surviving mutants, triage list)." >> $GITHUB_STEP_SUMMARY
          echo "See docs/mutation-testing.md for how to action surviving mutants." >> $GITHUB_STEP_SUMMARY

      # A persistent nightly failure must not go unnoticed (the job is red
      # on every run until fixed). Open one tracking issue keyed on a stable
      # title and comment on it for each further failing run, the same
      # pattern differential-fuzz.yml uses. Skipped stacks do not count.
      - name: Report to tracking issue
        if: github.event_name == 'schedule' && contains(join(needs.*.result, ' '), 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOROBAN_RESULT: ${{ needs.mutants-soroban.result }}
          TS_RESULT: ${{ needs.mutants-ts.result }}
          EVM_RESULT: ${{ needs.mutants-evm.result }}
        run: |
          title="[MUTATION] Nightly mutation testing is failing"
          {
            echo "### Run details"
            echo ""
            echo "- Run: $RUN_URL"
            echo "- Soroban: \`$SOROBAN_RESULT\`"
            echo "- TypeScript: \`$TS_RESULT\`"
            echo "- EVM: \`$EVM_RESULT\`"
          } > run-details.md

          existing=$(gh issue list --repo "$REPO" --state open --limit 100 \
                       --search "\"$title\" in:title" --json number,title \
                     | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n1)

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body-file run-details.md
          else
            {
              echo "The nightly mutation testing workflow finished with a failing stack."
              echo "Mutation scores were not enforced for the failing stack(s); see the run below."
              echo ""
              cat run-details.md
            } > issue-body.md
            gh issue create --repo "$REPO" --title "$title" --label "bug,mutation-testing" \
              --body-file issue-body.md
          fi

      # Surface a red run at the top level too. "skipped" is fine (the
      # stack was not selected on a manual dispatch); anything else is not.
      - name: Fail if any stack failed
        env:
          RESULTS: ${{ needs.mutants-soroban.result }} ${{ needs.mutants-ts.result }} ${{ needs.mutants-evm.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a mutation-testing job finished with result '$r'"; exit 1 ;;
            esac
          done
