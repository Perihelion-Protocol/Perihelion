name: Dependency audit

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "test/**"
      - "contracts/soroban/Cargo.toml"
      - "contracts/soroban/Cargo.lock"
      - "deny.toml"
      - ".github/dependency-audit-allowlist.json"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/check-npm-audit.mjs"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "test/**"
      - "contracts/soroban/Cargo.toml"
      - "contracts/soroban/Cargo.lock"
      - "deny.toml"
      - ".github/dependency-audit-allowlist.json"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/check-npm-audit.mjs"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --omit=dev --json --audit-level=high > npm-audit.json || true
          node scripts/check-npm-audit.mjs npm-audit.json .github/dependency-audit-allowlist.json

  cargo-audit:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny (advisories, licences, bans, sources)
        run: cargo deny --manifest-path contracts/soroban/Cargo.toml --config deny.toml check advisories licenses bans sources
