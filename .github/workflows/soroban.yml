name: Soroban

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: soroban-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs only check out, build, and test.
permissions:
  contents: read

jobs:
  changes:
    name: Detect Soroban changes
    runs-on: ubuntu-latest
    outputs:
      soroban: ${{ steps.filter.outputs.soroban }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            soroban:
              - 'contracts/soroban/**'
              - '.github/workflows/soroban.yml'
              - 'scripts/check-spdx-headers.sh'

  soroban:
    name: Soroban (Rust)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.soroban == 'true'
    defaults:
      run:
        working-directory: contracts/soroban
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Check SPDX license headers
        working-directory: .
        run: ./scripts/check-spdx-headers.sh

      - name: Read pinned Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master (pinned)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Verify toolchain in effect
        run: ../../scripts/check-toolchain.sh rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/soroban/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/soroban/**/Cargo.toml', 'contracts/soroban/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Fails a Cargo.lock update (e.g. from Dependabot) that pulls in a crate
      # whose MSRV is newer than rust-toolchain.toml, with a clear step name.
      - name: Cargo.lock builds on the pinned toolchain
        run: cargo check --workspace --locked

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: .
        run: make test-soroban

      - name: Build wasm (release)
        working-directory: .
        run: make build-soroban

      - name: Wasm size check
        run: |
          WASM=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name 'perihelion_settlement.wasm' | head -1)
          if [ -z "$WASM" ]; then
            echo "::error::release wasm not found — cannot enforce the size budget"
            exit 1
          fi
          BUDGET=$(jq -r '.max_wasm_size_bytes' settlement/ci/resource-baselines.json)
          SIZE=$(stat -c%s "$WASM")
          echo "wasm size: $SIZE bytes (budget $BUDGET)"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::wasm size $SIZE exceeds the budget of $BUDGET bytes in settlement/ci/resource-baselines.json"
            exit 1
          fi

  # Required gate for branch protection on the Soroban workflow.
  # Passes when the soroban job succeeds or is skipped; fails if it fails/cancels.
  check:
    name: Soroban / required
    runs-on: ubuntu-latest
    needs: [soroban]
    if: always()
    steps:
      - name: Assert soroban job passed or was skipped
        run: |
          result="${{ needs.soroban.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "::error::soroban job $result — merge is blocked."
            exit 1
          fi
          echo "soroban result: $result — gate passes."
