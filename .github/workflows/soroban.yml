name: Soroban

on:
  push:
    branches: [main]
    paths: ["contracts/soroban/**", ".github/workflows/soroban.yml", "scripts/check-spdx-headers.sh"]
  pull_request:
    branches: [main]
    paths: ["contracts/soroban/**", ".github/workflows/soroban.yml", "scripts/check-spdx-headers.sh"]

concurrency:
  group: soroban-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soroban:
    name: Soroban (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/soroban
    steps:
      - uses: actions/checkout@v7

      - name: Check SPDX license headers
        working-directory: .
        run: ./scripts/check-spdx-headers.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.81.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/soroban/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/soroban/**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: .
        run: make test-soroban

      - name: Build wasm (release)
        working-directory: .
        run: make build-soroban

  # Required gate for branch protection on the Soroban workflow.
  # Passes when the soroban job succeeds or is skipped; fails if it fails/cancels.
  check:
    name: Required check
    runs-on: ubuntu-latest
    needs: [soroban]
    if: always()
    steps:
      - name: Assert soroban job passed or was skipped
        run: |
          result="${{ needs.soroban.result }}"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "::error::soroban job $result — merge is blocked."
            exit 1
          fi
          echo "soroban result: $result — gate passes."
