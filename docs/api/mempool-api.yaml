openapi: 3.1.0

info:
  title: Perihelion Mempool API
  version: 1.0.0
  contact:
    name: Perihelion Protocol
    url: https://github.com/Perihelion-Protocol/Perihelion
  description: |
    The Perihelion Mempool API is the HTTP surface through which clients
    submit signed intents, query their lifecycle status, and list intents
    by status.

    ## Intent lifecycle

    The mempool assigns five statuses. Transitions between them are reported
    by trusted services via `PATCH /intents/{hash}/status`:

    ```
    pending → filled → settled
       ↘        ↘
        expired   refunded
    ```

    | Status     | Meaning                                                      |
    |------------|--------------------------------------------------------------|
    | `pending`  | Signed and in the mempool, not yet picked up by a solver     |
    | `filled`   | Delivered on Stellar; awaiting source-chain `Released`       |
    | `settled`  | Source chain emitted `Released`; bridge complete (terminal)  |
    | `refunded` | Refunded after a failed or cancelled fill (terminal)         |
    | `expired`  | Deadline passed before the intent was filled (terminal)      |

    The SDK's broader lifecycle vocabulary (for example `claimed` and
    `settling`) is never assigned by this mempool and is not part of this
    contract; solvers and the relayer track those intermediate states
    out-of-band.

    `filled` is an intermediate, non-terminal state: the solver has delivered
    the assets on Stellar, but the source-chain escrow has not yet released
    the funds. A record becomes `settled` only after the source chain has
    emitted `Released` for the intent; `settled` is reported by the component
    that observes that event, not by the solver at fill time. Clients must
    treat `filled` as distinct from `settled` — in particular, a `filled`
    intent whose release fails can still be refunded.

    ## Status ownership

    The mempool does not observe chain state itself. Status transitions are
    reported by trusted relayer/solver services via
    `PATCH /intents/{hash}/status`, authenticated with a bearer token shared
    out-of-band (the mempool operator's `statusToken`). If no token is
    configured, the endpoint is unauthenticated — suitable only for local
    development. Mempool status is a convenience hint for polling clients; it
    is not a substitute for verifying settlement on-chain.

    ## Pagination

    `GET /intents` returns an envelope `{ records, nextCursor }`. Pass the
    `nextCursor` from one response as the `cursor` query parameter of the next
    request to page forward; `nextCursor` is absent once the last page has
    been returned. A `cursor` that no longer resolves to a record — the record
    it named was evicted by the expiry sweep or the size cap, or a status
    change (or the `status`/`chainId` filter) moved it out of the result set
    being paged — is rejected with `400` and `code: "unresolvable_cursor"` so a
    client can restart pagination deliberately instead of being silently sent
    back to page one. A malformed cursor (not a `0x`-prefixed 32-byte hash) is
    rejected with `400` and `error` only.

    ## Error responses

    All error responses share the shape `{ "error": "<message>" }` and use
    standard HTTP status codes. Some errors add a machine-readable `code`
    (currently only `unresolvable_cursor`). This holds for errors raised by the
    HTTP framework as well as by application code: a body that is not valid
    JSON returns `400`, a body above the 8 KiB limit returns `413` with a
    message naming the limit, and a request to an unknown route or method
    returns `404`. Every route is rate limited per client IP and returns `429`
    when its budget is exhausted. No response is ever an HTML error page, and
    none includes a stack trace.

    **Duplicate submissions.** `POST /intents` overwrites the stored record for
    a hash that has already been submitted (last write wins): the record's
    status is reset to `pending` and the call returns `201` with the same hash.
    A `409 Conflict` is not part of this contract (see #320).

    **Hash normalisation.** Both `GET /intents/{hash}` and
    `PATCH /intents/{hash}/status` normalise the `:hash` to lower case and
    reject a value that is not a `0x`-prefixed 32-byte hex string with `400`, so
    a malformed hash is distinguishable from an unknown one on every route that
    takes a hash.

    **Operational endpoints.** `GET /healthz`, `GET /readyz` and `GET /metrics`
    are documented under *Operations*. They are not part of the intent API.

servers:
  - url: http://localhost:3000
    description: Local development server (default port)

tags:
  - name: Intents
    description: Submit and query cross-chain bridge intents
  - name: Discovery
    description: Server metadata and EIP-712 domain discovery
  - name: Operations
    description: Health, readiness and metrics for operators

paths:

  /info:
    get:
      operationId: getInfo
      tags: [Discovery]
      summary: Server metadata and EIP-712 domain discovery
      description: |
        Returns static metadata about the mempool server together with the
        EIP-712 domain parameters clients must use to sign intents.

        Clients should fetch this once at start-up and cache the result; the
        domain is stable for the lifetime of a deployment. The `domain`
        object mirrors the EIP-712 `EIP712Domain` type used by the on-chain
        verifier, so a client can construct the signing domain directly from
        this response without hard-coding chain-specific values.
      responses:
        '200':
          description: Server metadata and EIP-712 domain parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
              example:
                chainId: 8453
                verifyingContract: "0x0000000000000000000000000000000000000000"
                domain:
                  name: "Perihelion"
                  version: "1"
                  chainId: 8453
                  verifyingContract: "0x0000000000000000000000000000000000000000"

  /healthz:

    get:
      operationId: getHealthz
      tags: [Operations]
      summary: Liveness probe
      description: |
        Returns `200` while the HTTP listener is up. Not rate limited and not
        authenticated.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "ok"

  /readyz:

    get:
      operationId: getReadyz
      tags: [Operations]
      summary: Readiness probe
      description: |
        Returns `200` once the server has started and its expiry sweep is
        running, and `503` otherwise. Not rate limited and not authenticated.
      responses:
        '200':
          description: The server is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: "ready"
        '503':
          description: The server has not started (or has stopped).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: "not ready"
                reason: "sweep timer not started"

  /metrics:

    get:
      operationId: getMetrics
      tags: [Operations]
      summary: Prometheus metrics
      description: |
        Prometheus text exposition (`text/plain; version=0.0.4`). Every value is
        O(1) in store size. Counters end in `_total`; gauges do not.

        When the operator configures a `metricsToken`
        (`PERIHELION_METRICS_TOKEN`), this endpoint requires a matching bearer
        token; otherwise it is open to any client that can reach the listener.
        It is subject to the read rate limit.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP mempool_store_size Total number of records in the store
                # TYPE mempool_store_size gauge
                mempool_store_size 0
        '401':
          description: A `metricsToken` is configured and the bearer token is missing or wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '429':
          $ref: '#/components/responses/RateLimited'

  /intents:

    post:
      operationId: submitIntent
      tags: [Intents]
      summary: Submit a signed intent
      description: |
        Validates the EIP-712 signature over the intent, computes the canonical
        `intent_hash`, and stores the record with status `pending`.

        The server rejects the submission with `400` if the body is missing the
        intent, the signature is not a hex string, the intent is malformed or
        expired, or the signature does not verify against the intent's user
        under the server's EIP-712 domain.

        **Duplicate submissions overwrite.** If an intent with the same hash has
        already been submitted, this call overwrites the stored record (last
        write wins, resetting its status to `pending`) and returns `201` with
        the same hash. A `409 Conflict` is not part of this contract (see
        #320).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedIntent'
            example:
              intent:
                user: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                destination: "GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5"
                sourceChainId: 8453
                sourceAsset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
                sourceAmount: "1000000"
                destAsset: "USDC:GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
                minDestAmount: "9900000"
                deadline: 1751280000
                nonce: "95395590780195993686340100862393633005949636859136019347794446361576576451305"
                preferredSolver: "0x0000000000000000000000000000000000000000"
              signature: "0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b0f1e2d3c4b5a69780f1e2d3c4b5a69780f1e2d3c4b5a69780f1e2d3c4b5a69781c"
              hash: "0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b"
      responses:
        '201':
          description: |
            Intent accepted and stored; returns the canonical intent hash.
            Also returned when overwriting a prior submission with the same
            hash (see the duplicate-submission note above).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitIntentResponse'
              example:
                hash: "0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b"
        '400':
          description: |
            Validation failure — missing required fields, invalid EIP-712
            signature, or a request body that is not well-formed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingIntent:
                  summary: Missing intent
                  value:
                    error: "Missing intent"
                malformedSignature:
                  summary: Signature is not a 0x-prefixed hex string
                  value:
                    error: "Invalid signature"
                signatureMismatch:
                  summary: Well-formed signature that does not verify
                  value:
                    error: "Signature verification failed"
                expiredDeadline:
                  summary: Deadline has already passed
                  value:
                    error: "Intent has expired"
                malformedJson:
                  summary: Request body is not valid JSON
                  value:
                    error: "Malformed JSON request body"
        '413':
          description: |
            The JSON request body exceeds the server's 8 KiB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Request body exceeds the 8kb limit"
        '429':
          $ref: '#/components/responses/RateLimited'

    get:
      operationId: listIntents
      tags: [Intents]
      summary: List intents
      description: |
        Returns a page of intents, optionally filtered by status. Results are
        returned in submission order. See the pagination notes in the API
        description for cursor semantics.
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by intent status.
          schema:
            $ref: '#/components/schemas/IntentStatus'
        - name: cursor
          in: query
          required: false
          description: |
            Opaque pagination cursor returned as `nextCursor` by a previous
            call. A cursor that no longer resolves to a record is rejected
            with `400` and `code: "unresolvable_cursor"`.
          schema:
            type: string
        - name: chainId
          in: query
          required: false
          description: |
            Only return intents whose source chain is this EIP-155 chain id.
            Must be a positive integer; an intent for an unknown chain yields
            an empty page, not an error.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of records to return. Values outside 1–1000 are
            rejected with `400`; they are not clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: A page of intents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntentsResponse'
        '400':
          description: |
            Invalid query parameters (`status`, `chainId`, `limit`, `cursor`),
            or a cursor that no longer resolves to a record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidStatus:
                  summary: Unknown status filter
                  value:
                    error: "Invalid status filter"
                invalidLimit:
                  summary: Limit outside 1–1000
                  value:
                    error: "Invalid limit"
                unresolvableCursor:
                  summary: Cursor no longer resolves
                  value:
                    error: "Cursor no longer resolves to a record"
                    code: "unresolvable_cursor"
        '429':
          $ref: '#/components/responses/RateLimited'

  /intents/{hash}:

    get:
      operationId: getIntent
      tags: [Intents]
      summary: Get an intent by hash
      description: |
        Returns the stored record for the given intent hash. The `:hash` is
        normalised to lower case; a value that is not a `0x`-prefixed 32-byte
        hex string is rejected with `400`.
      parameters:
        - $ref: '#/components/parameters/IntentHash'
      responses:
        '200':
          description: The intent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentRecord'
        '400':
          description: The hash is not a valid `0x`-prefixed 32-byte hex string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid intent hash"
        '404':
          description: No intent with this hash is known to the mempool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Intent not found"
        '429':
          $ref: '#/components/responses/RateLimited'

  /intents/{hash}/status:

    patch:
      operationId: updateIntentStatus
      tags: [Intents]
      summary: Report an intent status transition
      description: |
        Reports a status transition for the given intent. Intended for trusted
        relayer/solver services. When the mempool operator has configured a
        `statusToken`, this endpoint requires a matching bearer token; if no
        token is configured the endpoint is unauthenticated (local development
        only). The `:hash` is normalised to lower case and validated as a
        `0x`-prefixed 32-byte hex string.
      parameters:
        - $ref: '#/components/parameters/IntentHash'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
            example:
              status: "settled"
      responses:
        '200':
          description: The intent record, after the status change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentRecord'
        '400':
          description: |
            Invalid hash, or a status that is not one of the five states this
            mempool assigns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidHash:
                  summary: Malformed intent hash
                  value:
                    error: "Invalid intent hash"
                invalidStatus:
                  summary: Unknown status
                  value:
                    error: "Invalid status"
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: |
            No intent with this hash is known to the mempool, or the intent is
            already in a terminal status (`settled`, `refunded`, `expired`, `cancelled`)
            and can no longer change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Intent not found"
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    RateLimited:
      description: |
        The client exceeded its per-IP budget for this class of route (reads or
        writes) within the rate-limit window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Too many requests"

  parameters:
    IntentHash:
      name: hash
      in: path
      required: true
      description: |
        The canonical intent hash: a `0x`-prefixed 32-byte hex string. The
        server normalises the value to lower case before lookup.
      schema:
        type: string
        pattern: '^0x[0-9a-fA-F]{64}$'

  schemas:

    IntentStatus:
      type: string
      description: |
        The six statuses this mempool assigns. `claimed` and `settling` are
        part of the broader on-chain/SDK lifecycle but are never assigned by
        this reference implementation.

        `cancelled` is terminal: the user revoked the intent on the source chain
        with `cancelIntent` before any solver locked it (#1053).

        `filled` is intermediate: the solver has delivered on Stellar but the
        source chain has not yet released. `settled` is terminal and is only
        reported after the source chain emits `Released` for the intent.
      enum:
        - pending
        - filled
        - settled
        - refunded
        - expired
        - cancelled

    SignedIntent:
      type: object
      required: [intent, signature, hash]
      properties:
        intent:
          $ref: '#/components/schemas/Intent'
        signature:
          type: string
          description: EIP-712 signature over the intent, as a hex string.
        hash:
          type: string
          description: Canonical intent hash (`0x`-prefixed 32-byte hex).

    Intent:
      type: object
      required:
        - user
        - destination
        - sourceChainId
        - sourceAsset
        - sourceAmount
        - destAsset
        - minDestAmount
        - deadline
        - nonce
      properties:
        user:
          type: string
          description: Source-chain address of the intent author.
        destination:
          type: string
          description: Stellar address that will receive the bridged assets.
        sourceChainId:
          type: integer
          description: EIP-155 chain id of the source chain.
        sourceAsset:
          type: string
          description: Source-chain asset address.
        sourceAmount:
          type: string
          description: Amount of `sourceAsset` to bridge, as a decimal string.
        destAsset:
          type: string
          description: Stellar asset identifier (`CODE:ISSUER`).
        minDestAmount:
          type: string
          description: Minimum acceptable destination amount, as a decimal string.
        deadline:
          type: integer
          description: Unix timestamp after which the intent expires.
        nonce:
          type: string
          description: Per-intent nonce, as a decimal string.
        preferredSolver:
          type: string
          description: Optional preferred solver address; zero address means any solver.

    IntentRecord:
      type: object
      required: [hash, status, intent, signature, createdAt]
      properties:
        hash:
          type: string
          description: Canonical intent hash (`0x`-prefixed 32-byte hex).
        status:
          $ref: '#/components/schemas/IntentStatus'
        intent:
          $ref: '#/components/schemas/Intent'
        signature:
          type: string
        createdAt:
          type: integer
          description: Unix timestamp (seconds) at which the intent was accepted.

    SubmitIntentResponse:
      type: object
      required: [hash]
      properties:
        hash:
          type: string
          description: Canonical intent hash (`0x`-prefixed 32-byte hex).

    ListIntentsResponse:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/IntentRecord'
        nextCursor:
          type: string
          description: |
            Opaque cursor for the next page. Absent once the last page has
            been returned.

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/IntentStatus'

    InfoResponse:
      type: object
      required: [chainId, verifyingContract, domain]
      properties:
        chainId:
          type: integer
          description: EIP-155 chain id of the source chain this mempool serves.
        verifyingContract:
          type: string
          description: Address of the escrow contract the EIP-712 domain binds to.
        domain:
          $ref: '#/components/schemas/EIP712Domain'

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not ready]
        reason:
          type: string
          description: Present only when `status` is `not ready`.

    EIP712Domain:
      type: object
      required: [name, version, chainId, verifyingContract]
      description: |
        EIP-712 domain parameters clients must use when signing intents.
        Mirrors the on-chain `EIP712Domain` type used by the verifier.
      properties:
        name:
          type: string
          description: EIP-712 domain name.
        version:
          type: string
          description: EIP-712 domain version.
        chainId:
          type: integer
          description: EIP-155 chain id.
        verifyingContract:
          type: string
          description: Address of the verifying contract.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: |
            Machine-readable error code, present only on errors that define one
            (currently `unresolvable_cursor`).
          enum: [unresolvable_cursor]
