openapi: 3.1.0

info:
  title: Perihelion Mempool API
  version: 1.0.0
  contact:
    name: Perihelion Protocol
    url: https://github.com/Perihelion-Protocol/Perihelion
  description: |
    The Perihelion Mempool API is the HTTP surface through which clients
    submit signed intents, query their lifecycle status, and list intents
    by status.

    ## Intent lifecycle

    The full cross-chain intent lifecycle (as modeled by the SDK and the
    on-chain contracts) has seven states:

    ```
    pending → claimed → settling → filled → settled
           ↘                             ↘
            expired                       refunded
    ```

    | Status     | Meaning                                                      |
    |------------|--------------------------------------------------------------|
    | `pending`  | Signed, in the mempool, unclaimed by any solver              |
    | `claimed`  | A solver has locked the source-chain funds                   |
    | `settling` | Cross-chain LayerZero message is in flight                   |
    | `filled`   | Delivered on Stellar; awaiting source-chain `Released`       |
    | `settled`  | Source chain emitted `Released`; bridge complete             |
    | `refunded` | Solver-initiated refund after a failed or cancelled fill     |
    | `expired`  | Deadline passed before any solver claimed the intent         |

    **This mempool's `IntentStatus` only covers five of those seven states:**
    `pending`, `filled`, `settled`, `refunded`, `expired`. `claimed` and
    `settling` are part of the broader on-chain/SDK lifecycle but are never
    assigned by this reference implementation — solvers and the relayer
    currently track those intermediate states out-of-band.

    `filled` is an intermediate, non-terminal state: the solver has delivered
    the assets on Stellar, but the source-chain escrow has not yet released
    the funds. A record becomes `settled` only after the source chain has
    emitted `Released` for the intent; `settled` is reported by the component
    that observes that event, not by the solver at fill time. Clients must
    treat `filled` as distinct from `settled` — in particular, a `filled`
    intent whose release fails can still be refunded.

    ## Status ownership

    The mempool does not observe chain state itself. Status transitions are
    reported by trusted relayer/solver services via
    `PATCH /intents/{hash}/status`, authenticated with a bearer token shared
    out-of-band (the mempool operator's `statusToken`). If no token is
    configured, the endpoint is unauthenticated — suitable only for local
    development. Mempool status is a convenience hint for polling clients; it
    is not a substitute for verifying settlement on-chain.

    ## Pagination

    `GET /intents` returns an envelope `{ records, nextCursor }`. Pass the
    `nextCursor` from one response as the `cursor` query parameter of the next
    request to page forward; `nextCursor` is absent once the last page has
    been returned. A `cursor` that no longer resolves to a record — the record
    it named was evicted by the expiry sweep or the size cap, or a status
    change moved it out of a status-filtered result set — is rejected with
    `400` and `code: "unresolvable_cursor"` so a client can restart
    pagination deliberately instead of being silently sent back to page one.

    ## Error responses

    All error responses share the shape `{ "error": "<message>" }` and use
    standard HTTP status codes. This holds for errors raised by the HTTP
    framework as well as by application code: a body that is not valid JSON
    returns `400`, a body above the 8 KiB limit returns `413` with a message
    naming the limit, and a request to an unknown route or method returns
    `404`. No response is ever an HTML error page, and none includes a stack
    trace.

    **Resolved issues**:
    - (resolved, #963) `POST /intents` now returns `409 Conflict` when an
      intent with the same hash has already been submitted. The stored record
      is never overwritten from `POST`; terminal statuses (`settled`,
      `refunded`, `expired`) are permanent.
    - (resolved, #348/#561) Both `GET /intents/{hash}` and
      `PATCH /intents/{hash}/status` now normalise the `:hash` to lower case
      and reject a value that is not a `0x`-prefixed 32-byte hex string with
      `400`, so a malformed hash is distinguishable from an unknown one on
      every route that takes a hash.

servers:
  - url: http://localhost:3000
    description: Local development server (default port)

tags:
  - name: Intents
    description: Submit and query cross-chain bridge intents
  - name: Discovery
    description: Server metadata and EIP-712 domain discovery

paths:

  /info:
    get:
      operationId: getInfo
      tags: [Discovery]
      summary: Server metadata and EIP-712 domain discovery
      description: |
        Returns static metadata about the mempool server together with the
        EIP-712 domain parameters clients must use to sign intents.

        Clients should fetch this once at start-up and cache the result; the
        domain is stable for the lifetime of a deployment. The `domain`
        object mirrors the EIP-712 `EIP712Domain` type used by the on-chain
        verifier, so a client can construct the signing domain directly from
        this response without hard-coding chain-specific values.
      responses:
        '200':
          description: Server metadata and EIP-712 domain parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
              example:
                chainId: 8453
                verifyingContract: "0x0000000000000000000000000000000000000000"
                domain:
                  name: "Perihelion"
                  version: "1"
                  chainId: 8453
                  verifyingContract: "0x0000000000000000000000000000000000000000"

  /intents:

    post:
      operationId: submitIntent
      tags: [Intents]
      summary: Submit a signed intent
      description: |
        Validates the EIP-712 signature over the intent, computes the canonical
        `intent_hash`, and stores the record with status `pending`.

        The server rejects the submission if the signature is invalid or any
        required field is missing (`400`).

        If an intent with the same hash has already been submitted, this call
        returns `409 Conflict` with the stored record (including its current
        status) and does **not** overwrite it. This prevents re-submission from
        resetting a terminal state (`settled`, `refunded`, `expired`) back to
        `pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedIntent'
            example:
              intent:
                user: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                destination: "GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5"
                sourceChainId: 8453
                sourceAsset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
                sourceAmount: "1000000"
                destAsset: "USDC:GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
                minDestAmount: "9900000"
                deadline: 1751280000
                nonce: "95395590780195993686340100862393633005949636859136019347794446361576576451305"
                preferredSolver: "0x0000000000000000000000000000000000000000"
              signature: "0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b0f1e2d3c4b5a69780f1e2d3c4b5a69780f1e2d3c4b5a69780f1e2d3c4b5a69781c"
              hash: "0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b"
      responses:
        '201':
          description: |
            Intent accepted and stored; returns the canonical intent hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitIntentResponse'
              example:
                hash: "0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b"
        '400':
          description: |
            Validation failure — missing required fields, invalid EIP-712
            signature, or a request body that is not well-formed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  summary: Missing intent or signature
                  value:
                    error: "Missing intent or signature"
                invalidSignature:
                  summary: Invalid EIP-712 signature
                  value:
                    error: "Invalid signature"
                expiredDeadline:
                  summary: Deadline has already passed
                  value:
                    error: "Intent deadline has passed"
                malformedJson:
                  summary: Request body is not valid JSON
                  value:
                    error: "Malformed JSON request body"
        '409':
          description: |
            An intent with the same hash has already been submitted. The stored
            record is returned unchanged (including its current status). The
            caller may inspect the `status` field to determine whether the
            intent is still `pending`, has been `filled`, or has reached a
            terminal state (`settled`, `refunded`, or `expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentRecord'
              example:
                hash: "0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b"
                status: "settled"
        '413':
          description: |
            The JSON request body exceeds the server's 8 KiB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Request body exceeds 8192 bytes"

    get:
      operationId: listIntents
      tags: [Intents]
      summary: List intents
      description: |
        Returns a page of intents, optionally filtered by status. Results are
        returned in submission order. See the pagination notes in the API
        description for cursor semantics.
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by intent status.
          schema:
            $ref: '#/components/schemas/IntentStatus'
        - name: cursor
          in: query
          required: false
          description: |
            Opaque pagination cursor returned as `nextCursor` by a previous
            call. A cursor that no longer resolves to a record is rejected
            with `400` and `code: "unresolvable_cursor"`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: A page of intents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntentsResponse'
        '400':
          description: |
            Invalid query parameters, or a cursor that no longer resolves to
            a record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidStatus:
                  summary: Unknown status filter
                  value:
                    error: "Invalid status"
                unresolvableCursor:
                  summary: Cursor no longer resolves
                  value:
                    error: "unresolvable_cursor"

  /intents/{hash}:

    get:
      operationId: getIntent
      tags: [Intents]
      summary: Get an intent by hash
      description: |
        Returns the stored record for the given intent hash. The `:hash` is
        normalised to lower case; a value that is not a `0x`-prefixed 32-byte
        hex string is rejected with `400`.
      parameters:
        - $ref: '#/components/parameters/IntentHash'
      responses:
        '200':
          description: The intent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentRecord'
        '400':
          description: The hash is not a valid `0x`-prefixed 32-byte hex string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid intent hash"
        '404':
          description: No intent with this hash is known to the mempool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Intent not found"

  /intents/{hash}/status:

    patch:
      operationId: updateIntentStatus
      tags: [Intents]
      summary: Report an intent status transition
      description: |
        Reports a status transition for the given intent. Intended for trusted
        relayer/solver services. When the mempool operator has configured a
        `statusToken`, this endpoint requires a matching bearer token; if no
        token is configured the endpoint is unauthenticated (local development
        only). The `:hash` is normalised to lower case and validated as a
        `0x`-prefixed 32-byte hex string.
      parameters:
        - $ref: '#/components/parameters/IntentHash'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
            example:
              status: "settled"
      responses:
        '200':
          description: The updated intent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentRecord'
        '400':
          description: |
            Invalid hash, or a status that is not one of the five states this
            mempool assigns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidHash:
                  summary: Malformed intent hash
                  value:
                    error: "Invalid intent hash"
                invalidStatus:
                  summary: Unknown status
                  value:
                    error: "Invalid status"
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '404':
          description: |
            No intent with this hash is known to the mempool, or the intent is
            already in a terminal status (`settled`, `refunded`, `expired`)
            and can no longer change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Intent not found"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IntentHash:
      name: hash
      in: path
      required: true
      description: |
        The canonical intent hash: a `0x`-prefixed 32-byte hex string. The
        server normalises the value to lower case before lookup.
      schema:
        type: string
        pattern: '^0x[0-9a-fA-F]{64}$'

  schemas:

    IntentStatus:
      type: string
      description: |
        The five statuses this mempool assigns. `claimed` and `settling` are
        part of the broader on-chain/SDK lifecycle but are never assigned by
        this reference implementation.

        `filled` is intermediate: the solver has delivered on Stellar but the
        source chain has not yet released. `settled` is terminal and is only
        reported after the source chain emits `Released` for the intent.
      enum:
        - pending
        - filled
        - settled
        - refunded
        - expired

    SignedIntent:
      type: object
      required: [intent, signature, hash]
      properties:
        intent:
          $ref: '#/components/schemas/Intent'
        signature:
          type: string
          description: EIP-712 signature over the intent, as a hex string.
        hash:
          type: string
          description: Canonical intent hash (`0x`-prefixed 32-byte hex).

    Intent:
      type: object
      required:
        - user
        - destination
        - sourceChainId
        - sourceAsset
        - sourceAmount
        - destAsset
        - minDestAmount
        - deadline
        - nonce
      properties:
        user:
          type: string
          description: Source-chain address of the intent author.
        destination:
          type: string
          description: Stellar address that will receive the bridged assets.
        sourceChainId:
          type: integer
          description: EIP-155 chain id of the source chain.
        sourceAsset:
          type: string
          description: Source-chain asset address.
        sourceAmount:
          type: string
          description: Amount of `sourceAsset` to bridge, as a decimal string.
        destAsset:
          type: string
          description: Stellar asset identifier (`CODE:ISSUER`).
        minDestAmount:
          type: string
          description: Minimum acceptable destination amount, as a decimal string.
        deadline:
          type: integer
          description: Unix timestamp after which the intent expires.
        nonce:
          type: string
          description: Per-intent nonce, as a decimal string.
        preferredSolver:
          type: string
          description: Optional preferred solver address; zero address means any solver.

    IntentRecord:
      type: object
      required: [hash, status, intent, signature, createdAt]
      properties:
        hash:
          type: string
          description: Canonical intent hash (`0x`-prefixed 32-byte hex).
        status:
          $ref: '#/components/schemas/IntentStatus'
        intent:
          $ref: '#/components/schemas/Intent'
        signature:
          type: string
        createdAt:
          type: integer
          description: Unix timestamp (seconds) at which the intent was accepted.
        updatedAt:
          type: integer
          description: Unix timestamp of the most recent status change.

    SubmitIntentResponse:
      type: object
      required: [hash]
      properties:
        hash:
          type: string
          description: Canonical intent hash (`0x`-prefixed 32-byte hex).

    ListIntentsResponse:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/IntentRecord'
        nextCursor:
          type: string
          description: |
            Opaque cursor for the next page. Absent once the last page has
            been returned.

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/IntentStatus'

    InfoResponse:
      type: object
      required: [chainId, verifyingContract, domain]
      properties:
        chainId:
          type: integer
          description: EIP-155 chain id of the source chain this mempool serves.
        verifyingContract:
          type: string
          description: Address of the PerihelionEscrow contract used to bind the EIP-712 domain.
        domain:
          $ref: '#/components/schemas/EIP712Domain'

    EIP712Domain:
      type: object
      required: [name, version, chainId, verifyingContract]
      description: |
        EIP-712 domain parameters clients must use when signing intents.
        Mirrors the on-chain `EIP712Domain` type used by the verifier.
      properties:
        name:
          type: string
          description: EIP-712 domain name.
        version:
          type: string
          description: EIP-712 domain version.
        chainId:
          type: integer
          description: EIP-155 chain id.
        verifyingContract:
          type: string
          description: Address of the verifying contract.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
